name: M2 CI leve (sem deploy)
on:
  push:
    branches:
      - experiment/m2-astro-sanity-woocommerce
    paths:
      - src/lib/commerce/**
      - tests/m2-commerce-contract.test.mjs
      - .github/workflows/m2-light.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-light
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar catálogo original e contratos M2
        run: npm test
      - name: Verificar sintaxe
        run: |
          node --check src/lib/commerce/m2Contract.mjs
          node --check src/lib/commerce/wooRead.mjs
      - name: Build Astro sem deploy
        run: |
          npm install --no-audit --no-fund
          npm run build

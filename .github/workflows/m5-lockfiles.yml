name: M5 — Fixar dependências Astro e Sanity nesta branch experimental
on:
  push:
    branches:
      - feat/m5-preview-media-payment-pilot
    paths:
      - '.github/workflows/m5-lockfiles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m5-lockfiles
  cancel-in-progress: true
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile do Astro sem executar scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Gerar lockfile Sanity sem executar scripts
        run: cd studio && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verificar que manifests de produção não foram alterados
        shell: bash
        run: |
          test -f package-lock.json
          test -f studio/package-lock.json
          git status --short
          git diff --exit-code -- package.json studio/package.json
      - name: Salvar somente lockfiles nesta branch, sem tocar em main/gh-pages
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json studio/package-lock.json
          if git diff --staged --quiet; then
            echo "LOCKFILES_JA_EXISTEM"
            exit 0
          fi
          git commit -m "build(m5): fixar grafo npm de Astro e Sanity na branch experimental"
          git push origin HEAD:feat/m5-preview-media-payment-pilot
